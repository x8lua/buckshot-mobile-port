name: Verify Existing iOS Export
on:
  workflow_dispatch:
    inputs:
      export_run_id:
        description: Successful device build containing exported-xcode-project
        required: true
        default: '37946304032'
permissions:
  actions: read
  contents: read
jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exported-xcode-project
          path: build/export/
          run-id: ${{ inputs.export_run_id }}
          github-token: ${{ github.token }}
      - name: Build and verify existing export
        run: bash ci/build_ios.sh simulator
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-evidence
          path: build/evidence/
          retention-days: 14
